name: Release French Translations matching Cobblemon

on:
  schedule:
    # Daily check: publish only when Cobblemon itself has a new release.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the full pipeline without committing, tagging or publishing'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Re-publish the current Cobblemon version even if already published'
        required: false
        default: false
        type: boolean

env:
  COBBLEMON_SLUG: 'cobblemon'
  PACK_SLUG: 'cobblemon-french'
  MODRINTH_API: 'https://api.modrinth.com/v2'
  GITLAB_API: 'https://gitlab.com/api/v4/projects/cable-mc%2Fcobblemon'
  GITLAB_RAW: 'https://gitlab.com/cable-mc/cobblemon/-/raw'
  LANG_PATH: 'common/src/main/resources/assets/cobblemon/lang'
  LANG_FILE: 'assets/cobblemon/lang/en_us.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest official Cobblemon release
        id: upstream
        run: |
          set -euo pipefail

          echo "Querying Modrinth for the latest Cobblemon release..."
          LATEST=$(curl -sSL --fail --retry 3 "$MODRINTH_API/project/$COBBLEMON_SLUG/version" \
            | jq -c '[.[] | select(.version_type == "release")] | sort_by(.date_published) | last')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Could not determine the latest Cobblemon release from Modrinth"
            exit 1
          fi

          VERSION=$(echo "$LATEST" | jq -r '.version_number')
          MC_VERSIONS=$(echo "$LATEST" | jq -r '.game_versions | join(", ")')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Modrinth returned a release without a version number"
            exit 1
          fi

          echo "Latest Cobblemon release: $VERSION (Minecraft $MC_VERSIONS)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_versions=$MC_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Resolve last published pack version
        id: pack
        run: |
          set -euo pipefail

          PUBLISHED=$(curl -sSL --fail --retry 3 "$MODRINTH_API/project/$PACK_SLUG/version" \
            | jq -r 'sort_by(.date_published) | (last // {}) | .version_number // "none"')

          echo "Last published pack version: $PUBLISHED"
          echo "version=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Decide whether a release is needed
        id: decide
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          PUBLISHED_VERSION: ${{ steps.pack.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force_release || 'false' }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: exercising the pipeline without publishing."
            RELEASE=true
          elif [ "$FORCE" = "true" ]; then
            echo "Force release requested."
            RELEASE=true
          elif [ "$UPSTREAM_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Pack $PUBLISHED_VERSION already matches Cobblemon $UPSTREAM_VERSION - nothing to publish."
            RELEASE=false
          else
            echo "Cobblemon $UPSTREAM_VERSION is not published yet (pack is at $PUBLISHED_VERSION)."
            RELEASE=true
          fi

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Fetch translations at the matching Cobblemon tag
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail

          TAG="${{ steps.upstream.outputs.version }}"

          # The pack must ship exactly what the released mod ships: refuse to
          # fall back to a moving branch if the tag does not exist.
          if ! curl -sSL --fail --retry 3 -o /dev/null "$GITLAB_API/repository/tags/$TAG"; then
            echo "::error::Cobblemon has no git tag '$TAG' - refusing to build from an unpinned source"
            exit 1
          fi

          echo "Fetching fr_fr.json and en_us.json from Cobblemon tag $TAG..."
          curl -sSL --fail --retry 3 "$GITLAB_RAW/$TAG/$LANG_PATH/fr_fr.json" -o new_translation.json
          curl -sSL --fail --retry 3 "$GITLAB_RAW/$TAG/$LANG_PATH/en_us.json" -o upstream_en_us.json

          if ! jq empty new_translation.json 2>/dev/null; then
            echo "::error::Downloaded fr_fr.json is not valid JSON"
            exit 1
          fi

          echo "French keys: $(jq 'length' new_translation.json) / English keys: $(jq 'length' upstream_en_us.json)"

      - name: Report translation coverage
        if: steps.decide.outputs.release == 'true'
        continue-on-error: true
        id: coverage
        run: |
          set -euo pipefail

          MISSING=$(jq -n --slurpfile fr new_translation.json --slurpfile en upstream_en_us.json \
            '$en[0] | keys - ($fr[0] | keys) | length')
          TOTAL=$(jq 'length' upstream_en_us.json)
          TRANSLATED=$((TOTAL - MISSING))

          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "translated=$TRANSLATED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "$TRANSLATED/$TOTAL upstream strings have a French entry ($MISSING untranslated upstream)."

      - name: Sync translation file into the repository
        if: steps.decide.outputs.release == 'true'
        id: sync
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$LANG_FILE")"

          if [ -f "$LANG_FILE" ] && diff -q new_translation.json "$LANG_FILE" > /dev/null 2>&1; then
            echo "Translation file already matches tag ${{ steps.upstream.outputs.version }}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp new_translation.json "$LANG_FILE"
            echo "Updated $LANG_FILE from tag ${{ steps.upstream.outputs.version }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit translation changes
        if: steps.decide.outputs.release == 'true' && steps.sync.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LANG_FILE"
          git commit -m "chore: sync French translations with Cobblemon ${{ steps.upstream.outputs.version }}"
          git push

      - name: Build resource pack ZIP
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail

          VERSION="${{ steps.upstream.outputs.version }}"

          rm -f ./*.zip
          zip -r "cobblemon-french-$VERSION.zip" \
            pack.mcmeta \
            assets/ \
            pack.png \
            LICENSE \
            -x "*.git*" \
            -x "*.github*"

          echo "Built cobblemon-french-$VERSION.zip"
          ls -la ./*.zip

      - name: Upload artifact for inspection
        if: steps.decide.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cobblemon-french-${{ steps.upstream.outputs.version }}
          path: cobblemon-french-${{ steps.upstream.outputs.version }}.zip
          retention-days: 7

      - name: Publish to Modrinth
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: cobblemon-french-${{ steps.upstream.outputs.version }}.zip

          name: Cobblemon French ${{ steps.upstream.outputs.version }}
          version: ${{ steps.upstream.outputs.version }}
          version-type: release

          loaders: |
            minecraft

          game-versions: |
            ${{ steps.upstream.outputs.mc_versions }}

          changelog: |
            French translation pack for Cobblemon ${{ steps.upstream.outputs.version }} (Minecraft ${{ steps.upstream.outputs.mc_versions }}).

            Pack version matches the Cobblemon release it is built from. Translations are taken from Cobblemon's `fr_fr.json` at tag ${{ steps.upstream.outputs.version }}.

            Untranslated upstream strings: ${{ steps.coverage.outputs.missing }} of ${{ steps.coverage.outputs.total }}.

      - name: Create GitHub tag and release
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.upstream.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
            echo "Tag $VERSION already exists - skipping GitHub release."
            exit 0
          fi

          gh release create "$VERSION" \
            "cobblemon-french-$VERSION.zip" \
            --title "Cobblemon French $VERSION" \
            --notes "French translation pack matching Cobblemon $VERSION (Minecraft ${{ steps.upstream.outputs.mc_versions }}).

            Also available on Modrinth: https://modrinth.com/resourcepack/cobblemon-french/version/$VERSION"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Cobblemon French release check"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Latest Cobblemon release | ${{ steps.upstream.outputs.version || 'unknown' }} |"
            echo "| Last published pack | ${{ steps.pack.outputs.version || 'unknown' }} |"
            echo "| Release needed | ${{ steps.decide.outputs.release || 'unknown' }} |"
            echo "| Untranslated upstream strings | ${{ steps.coverage.outputs.missing || 'n/a' }} / ${{ steps.coverage.outputs.total || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.decide.outputs.release }}" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to publish: the pack already matches the latest Cobblemon release." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Dry run: no commit, no tag, no Modrinth publish." >> "$GITHUB_STEP_SUMMARY"
          fi
